[package]
name = "memvid-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
memvid-core = "2.0.133"
rmcp = { version = "0.12.0", features = ["transport-io"] }
tokio = { version = "1.49.0", features = ["full"] }
eyre = "0.6.12"
color-eyre = "0.6.5"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-log = "0.2.0"
tracing-error = "0.2.1"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = "1.2.0"
